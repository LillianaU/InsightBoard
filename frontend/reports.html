<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightBoard - Reportes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-bar-chart-fill me-2"></i>InsightBoard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="events.html"><i class="bi bi-calendar-event me-1"></i>Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="reports.html"><i class="bi bi-file-earmark-text me-1"></i>Reportes</a>
                    </li>
                </ul>
                <span id="nav-user" class="navbar-text">
                    <a href="login.html" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                    </a>
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-file-earmark-text me-2"></i>Reportes Personalizados</h2>
                <p class="text-muted">Crea y guarda reportes con métricas personalizadas</p>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Nuevo Reporte</h5>
                    </div>
                    <div class="card-body">
                        <form id="reportForm">
                            <div class="mb-3">
                                <label for="reportName" class="form-label">Nombre del Reporte</label>
                                <input type="text" class="form-control" id="reportName" placeholder="Ej: Ventas Septiembre" required>
                            </div>
                            <div class="mb-3">
                                <label for="reportType" class="form-label">Tipo de Gráfico</label>
                                <select class="form-select" id="reportType">
                                    <option value="line">Línea</option>
                                    <option value="bar">Barras</option>
                                    <option value="pie">Pastel</option>
                                    <option value="doughnut">Dona</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="reportDimension" class="form-label">Dimensión</label>
                                <select class="form-select" id="reportDimension">
                                    <option value="event_type">Tipo de Evento</option>
                                    <option value="source">Fuente</option>
                                    <option value="weekday">Día de la Semana</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="reportDays" class="form-label">Días a analizar</label>
                                <input type="number" class="form-control" id="reportDays" value="30" min="1" max="365">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-save me-2"></i>Guardar Reporte
                            </button>
                        </form>
                        <div id="reportAlert" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8 mb-4">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-graph-up me-2"></i>Vista Previa</h5>
                        <div>
                            <button class="btn btn-sm btn-success me-2" onclick="exportCSV()">
                                <i class="bi bi-download me-1"></i>CSV
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="exportPDF()">
                                <i class="bi bi-file-earmark-pdf me-1"></i>PDF
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <canvas id="reportChart" height="120"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-bookmark me-2"></i>Reportes Guardados</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Nombre</th>
                                        <th>Tipo</th>
                                        <th>Dimensión</th>
                                        <th>Días</th>
                                        <th>Creado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="savedReports">
                                    <tr><td colspan="6" class="text-center">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-5 py-4 bg-light">
        <div class="container text-center text-muted">
            <small>InsightBoard - Plataforma de Analítica - 2026</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        let currentChart = null;

        AUTH.requireAuth();
        AUTH.updateNavbar();

        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('reportName').value;
            const config = {
                chart_type: document.getElementById('reportType').value,
                dimension: document.getElementById('reportDimension').value,
                days: parseInt(document.getElementById('reportDays').value)
            };

            try {
                await AUTH.apiPost('/reports/', { name, config });
                showAlert('Reporte guardado correctamente', 'success');
                document.getElementById('reportForm').reset();
                loadSavedReports();
                updatePreview();
            } catch (error) {
                showAlert('Error: ' + error.message, 'danger');
            }
        });

        function showAlert(message, type) {
            const alert = document.getElementById('reportAlert');
            alert.className = `alert alert-${type} mt-3`;
            alert.innerHTML = message;
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 3000);
        }

        async function updatePreview() {
            const dimension = document.getElementById('reportDimension').value;
            const days = document.getElementById('reportDays').value;
            const chartType = document.getElementById('reportType').value;

            try {
                const data = await AUTH.apiGet(`/metrics/breakdown/?dimension=${dimension}&days=${days}`);
                const labels = data.map(d => d[dimension] || Object.values(d)[0]);
                const values = data.map(d => d.count);

                const ctx = document.getElementById('reportChart').getContext('2d');

                if (currentChart) currentChart.destroy();

                currentChart = new Chart(ctx, {
                    type: chartType,
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Cantidad',
                            data: values,
                            backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6f42c1']
                        }]
                    },
                    options: { responsive: true }
                });
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function loadSavedReports() {
            try {
                const data = await AUTH.apiGet('/reports/');
                const tbody = document.getElementById('savedReports');

                if (data.results && data.results.length > 0) {
                    tbody.innerHTML = data.results.map(report => `
                        <tr>
                            <td>${report.name}</td>
                            <td>${report.config.chart_type || '-'}</td>
                            <td>${report.config.dimension || '-'}</td>
                            <td>${report.config.days || '-'}</td>
                            <td>${formatDate(report.created_at)}</td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="alert('Próximamente: ver reporte')">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No hay reportes guardados</td></tr>';
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function exportCSV() {
            const dimension = document.getElementById('reportDimension').value;
            const days = document.getElementById('reportDays').value;

            try {
                const data = await AUTH.apiGet(`/metrics/breakdown/?dimension=${dimension}&days=${days}`);

                let csv = 'data:text/csv;charset=utf-8,';
                csv += `${dimension},count\n`;
                data.forEach(row => {
                    csv += `${row[dimension] || Object.values(row)[0]},${row.count}\n`;
                });

                const link = document.createElement('a');
                link.setAttribute('href', encodeURI(csv));
                link.setAttribute('download', 'reporte.csv');
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                alert('Error al exportar CSV');
            }
        }

        function exportPDF() {
            alert('Exportación a PDF: próximamente. Por ahora usa CSV.');
        }

        document.getElementById('reportDimension').addEventListener('change', updatePreview);
        document.getElementById('reportDays').addEventListener('change', updatePreview);

        loadSavedReports();
        updatePreview();
    </script>
</body>
</html>
