<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightBoard - Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-bar-chart-fill me-2"></i>InsightBoard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html"><i class="bi bi-house me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="events.html"><i class="bi bi-calendar-event me-1"></i>Eventos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html"><i class="bi bi-file-earmark-text me-1"></i>Reportes</a>
                    </li>
                </ul>
                <span id="nav-user" class="navbar-text">
                    <a href="login.html" class="btn btn-sm btn-outline-light">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                    </a>
                </span>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <h2><i class="bi bi-calendar-event me-2"></i>Registrar Evento</h2>
                <p class="text-muted">Agrega nuevos eventos a tu base de datos</p>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="bi bi-plus-circle me-2"></i>Nuevo Evento</h5>
                    </div>
                    <div class="card-body">
                        <form id="eventForm">
                            <div class="mb-3">
                                <label for="eventSource" class="form-label">Fuente de Datos</label>
                                <select class="form-select" id="eventSource" required>
                                    <option value="">Selecciona una fuente...</option>
                                    <option value="Tienda Online">Tienda Online</option>
                                    <option value="App Móvil">App Móvil</option>
                                    <option value="Sitio Web">Sitio Web</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="eventType" class="form-label">Tipo de Evento</label>
                                <input type="text" class="form-control" id="eventType" placeholder="Ej: compra, visita, click" required>
                            </div>
                            <div class="mb-3">
                                <label for="eventPayload" class="form-label">Datos Extra (JSON)</label>
                                <textarea class="form-control" id="eventPayload" rows="3" placeholder='{"producto": "camisa", "precio": 25}'></textarea>
                                <div class="form-text">Datos adicionales en formato JSON (opcional)</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-save me-2"></i>Guardar Evento
                            </button>
                        </form>
                        <div id="formAlert" class="mt-3" style="display: none;"></div>
                    </div>
                </div>
            </div>
            <div class="col-lg-8 mb-4">
                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Eventos Recientes</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="loadEvents()">
                            <i class="bi bi-arrow-clockwise me-1"></i>Actualizar
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Tipo</th>
                                        <th>Fuente</th>
                                        <th>Datos</th>
                                        <th>Fecha</th>
                                    </tr>
                                </thead>
                                <tbody id="eventsTable">
                                    <tr><td colspan="5" class="text-center">Cargando...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-5 py-4 bg-light">
        <div class="container text-center text-muted">
            <small>InsightBoard - Plataforma de Analítica - 2026</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script>
        AUTH.requireAuth();
        AUTH.updateNavbar();

        document.getElementById('eventForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const source = document.getElementById('eventSource').value;
            const eventType = document.getElementById('eventType').value;
            let payload = {};
            try {
                const payloadText = document.getElementById('eventPayload').value;
                if (payloadText) payload = JSON.parse(payloadText);
            } catch (err) {
                payload = { raw: document.getElementById('eventPayload').value };
            }

            try {
                await AUTH.apiPost('/events/ingest/', { source, event_type: eventType, payload });
                showAlert('Evento guardado correctamente', 'success');
                document.getElementById('eventForm').reset();
                loadEvents();
            } catch (error) {
                showAlert('Error: ' + error.message, 'danger');
            }
        });

        function showAlert(message, type) {
            const alert = document.getElementById('formAlert');
            alert.className = `alert alert-${type} mt-3`;
            alert.innerHTML = message;
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 3000);
        }

        async function loadEvents() {
            try {
                const data = await AUTH.apiGet('/events/list/?days=30&page_size=20');
                const tbody = document.getElementById('eventsTable');

                if (data.results && data.results.length > 0) {
                    tbody.innerHTML = data.results.map(event => `
                        <tr>
                            <td>${event.id}</td>
                            <td><span class="badge bg-primary">${event.event_type}</span></td>
                            <td>${event.source ? event.source.name : '-'}</td>
                            <td><code>${JSON.stringify(event.payload).substring(0, 30)}...</code></td>
                            <td>${formatDate(event.created_at)}</td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No hay eventos</td></tr>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('eventsTable').innerHTML = '<tr><td colspan="5" class="text-center text-danger">Error al cargar</td></tr>';
            }
        }

        loadEvents();
    </script>
</body>
</html>
